<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9b88" />
    <meta name="description" content="Personal Finance Manager — private, offline, local-first." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Personal Finance Manager</title>
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(70% 60% at 50% 0%,rgba(255,255,255,.18),transparent 70%),linear-gradient(150deg,#0d9b88,#0a7a6b);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;transition:opacity .4s ease}
      #splash .mark{width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;box-shadow:0 16px 36px rgba(0,0,0,.18);animation:splashIn .55s cubic-bezier(.2,1.2,.35,1) both}
      #splash h1{font-size:19px;font-weight:800;letter-spacing:-.03em;margin-top:16px}
      #splash p{font-size:11px;opacity:.8;margin-top:4px}
      @keyframes splashIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
    </style>
  </head>
  <body>
    <div id="splash"><div class="mark">৳</div><h1>Personal Finance Manager</h1><p>Your money, your device</p></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // The splash is purely visual. Production service-worker registration
      // lives in src/main.tsx so it can be guarded by import.meta.env.PROD.
      window.addEventListener('load', function () {
        setTimeout(function () {
          var s = document.getElementById('splash');
          if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 450); }
        }, 500);
      });
    </script>
  </body>
</html>
